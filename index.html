<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kok Bisa Video AI PRO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b14;color:#fff;font-family:Arial}
header{padding:20px;background:#101629;border-bottom:1px solid #242d46}
.logo{font-size:24px;font-weight:bold;color:#8b7cff}
main{max-width:850px;margin:auto;padding:20px}
.hero{text-align:center;padding:25px 0}
.hero h1{font-size:34px}
.hero span{color:#8b7cff}
.card{background:#12192b;border:1px solid #26314d;border-radius:18px;padding:22px;margin:18px 0}
label{display:block;margin:16px 0 8px}
textarea,select,input{width:100%;padding:14px;background:#080e1c;color:white;border:1px solid #303c5d;border-radius:10px;font-size:16px}
button{padding:15px;background:linear-gradient(90deg,#6555ff,#9a4dff);border:0;border-radius:12px;color:white;font-weight:bold;font-size:16px;width:100%;margin-top:18px}
button:hover{opacity:.9}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.badge{color:#9d91ff;font-size:12px}
#status{margin-top:18px;color:#aab7d6;line-height:1.6}
footer{text-align:center;padding:30px;color:#66718f}
@media(max-width:550px){.grid{grid-template-columns:1fr}.hero h1{font-size:27px}}
</style>
</head>
<body>
<header>
<div class="logo">✨ KOK BISA AI <span style="color:white">PRO</span></div>
<div class="badge">AI VIDEO CREATOR STUDIO</div>
</header>

<main>
<section class="hero">
<h1>Turn Your Ideas Into <span>Videos</span></h1>
<p>Studio kreatif AI generasi berikutnya.</p>
</section>

<div class="card">
<h2>🎬 Video Generator</h2>
<label>Deskripsi Video</label>
<textarea id="prompt" rows="5" placeholder="Ceritakan video yang ingin kamu buat..."></textarea>

<div class="grid">
<div>
<label>Mode</label>
<select id="mode">
<option>Text to Video</option>
<option>Image to Video</option>
</select>
</div>
<div>
<label>Gaya Visual</label>
<select id="style">
<option>Cinematic</option>
<option>Anime</option>
<option>Realistic</option>
<option>3D Animation</option>
<option>Fantasy</option>
</select>
</div>
</div>

<label>Upload Gambar (Opsional)</label>
<input type="file" id="image" accept="image/*">

<div class="grid">
<div>
<label>Durasi</label>
<select id="duration">
<option>5 detik</option>
<option>10 detik</option>
<option>15 detik</option>
</select>
</div>
<div>
<label>Rasio</label>
<select id="ratio">
<option>16:9 Landscape</option>
<option>9:16 Portrait</option>
<option>1:1 Square</option>
</select>
</div>
</div>

<button onclick="generate()">✨ GENERATE VIDEO</button>
<div id="status"></div>
</div>

<div class="card">
<h3>⚡ AI Studio Features</h3>
<p>• Text to Video</p>
<p>• Image to Video</p>
<p>• Cinematic Styles</p>
<p>• Video Preview</p>
<p>• MP4 Download Support</p>
</div>
</main>

<footer>© 2026 Kok Bisa Video AI PRO</footer>

<script>
function generate(){
const p=document.getElementById("prompt").value.trim();
const mode=document.getElementById("mode").value;
const style=document.getElementById("style").value;
const duration=document.getElementById("duration").value;
const ratio=document.getElementById("ratio").value;
const file=document.getElementById("image").files[0];
const status=document.getElementById("status");

if(!p){status.innerHTML="⚠️ Masukkan deskripsi video terlebih dahulu.";return;}

if(mode==="Image to Video"&&!file){
status.innerHTML="⚠️ Upload gambar untuk mode Image to Video.";
return;
}

status.innerHTML="<b>📝 Prompt siap!</b><br>Mode: "+mode+
"<br>Gaya: "+style+
"<br>Durasi: "+duration+
"<br>Rasio: "+ratio+
"<br><br>⚠️ Mesin AI video belum terhubung. Website ini belum menghasilkan MP4. Backend AI diperlukan untuk proses video.";
}
</script>
</body>
</html>
